# 门禁分层清单 · spec/gates_layers.yaml
# 质量进攻路线 Q3(ADR-0004)的可执行资产:把 SW spec/checks 下 81 条规则按对象分层。
#
# 分层原则(对照 narracat 分层纪律 + 本项目营销目标约束):
#   - accounting(账房层):写"什么"的硬约束 —— 合规/品牌事实/可拍性/一致性/结构完整性。
#     营销目标的必要条件,severity:block 保留,继续驱动修订闭环(修订 brief 的 PROBLEM 段)。
#   - craft(创作层):写"怎么"的主观质量 —— 文笔/节奏/反AI/工艺引导(爆款实证频率)。
#     从修订闭环的 WHAT TO CHANGE 摘除,降级为"度量+范例引导"(仍进 dashboard,不阻断)。
#
# 用途:
#   1. 优化 agent 进场后按此清单对 SW 提 PR(见 ADR-0004 Q3 执行步骤);
#   2. boot_check 校验本文件存在(已在 scripts/boot_check.py);
#   3. 修订 brief 消费方(revision_brief.py)可按本清单过滤 craft 层规则。
# 改动需 ADR(本文件属 spec/ 资产)。

