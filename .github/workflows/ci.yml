name: ci
# 步骤变更必须同步 Makefile::ci 与 scripts/ci.py(三处同构,drift = 事故)
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: sync deps
        run: uv sync
      - name: lint
        run: uv run ruff check src tests scripts
      - name: test
        run: uv run pytest -q
      - name: corpus leak guard
        run: uv run python scripts/corpus_leak_guard.py
