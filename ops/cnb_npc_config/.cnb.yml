# 放到 Cloudbird-Software/talk 仓库根目录,文件名必须为 .cnb.yml
# 作用(docs/CNB_QUOTA_PLAYBOOK.md 杠杆一+二):
#   1) NPC 事件流水线降配 runner.cpus: 1(默认 8 核 → 核时省 8×);
#   2) 两个事件都配(只配一个,另一个仍走系统默认 8 核)。
$:
  issue.comment@npc:
    - runner:
        tags: cnb:arch:amd64
        cpus: 1
      docker:
        image: cnbcool/default-npc:latest
      stages:
        - name: npc go
          type: npc:go

  pull_request.comment@npc:
    - runner:
        tags: cnb:arch:amd64
        cpus: 1
      docker:
        image: cnbcool/default-npc:latest
      stages:
        - name: npc go
          type: npc:go
