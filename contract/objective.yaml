# 优化目标契约 · 优化器只读,改动需人类确认 + ADR
# v2(ADR-0003,2026-08-27 owner 批准):craft_bench 主攻 + 判官三轴降防崩地板
version: 2

primary_metric: craft_bench           # 加权达标率,锚=爆款 315 卡实证频率(scripts/craft_bench.py)
primary_threshold: 0.02               # 晋升要求 craft_bench 相对 champion 提升 > 0.02

floor_axes:                           # 防崩地板(IP brief):不许相对 champion 跌出噪声带
  - transportation                    # 三轴中唯一有量程且无 brief 类型失真的轴
noise_band: 0.05                      # v2/v2b 同产物双跑实测的判官噪声宽度

report_only_axes:                     # 只记录不进判定(IP brief)
  - placement_integration             # IP brief 退化为符号密度(placement_axis_review.md);实物 brief 恢复进地板
  - l0_dialogue                       # 触顶无量程(v1 起 1.0,无法当地板)

legacy_axes:                          # v1 轴清单(历史对齐用,不再全数进判定)
  - naturalness
  - hook_strength
  - placement_integration
  - transportation
  - producibility
  - prose_craft

gates:
  l0_all_pass: true        # 对 SW 的 spec/checks 全部 severity:block 规则
  first_pass_watch: true   # 一过率监控(docs/first_pass_baseline.md):质量上升不得以一过率崩塌为代价

eval_cascade:              # 级联评测阶梯:越往下越贵;候选须过上一档才配进入下一档
  - tier: scene            # 单场景重编译(SW recompile_scene)+ L0 + L1 标量
    promotes_at: p50
  - tier: episode          # 单集 + dev 判官成对
    promotes_at: p50
  - tier: book             # 全量 + sealed 提交(配额制)
    promotes_at: manual    # 仅晋升候选

brief_distribution: spec/brief_distribution.yaml   # 训练/评测 brief 分布规格;优化器不可改(L-14)

resources:                 # 人类管理;优化器可见但不可改;null = 暂不设限
  per_experiment_usd: null
  sealed_quota_per_round: 20
  human_label_credits: 0   # 合成优先启动;调 >0 需人类批准(ADR-0001 L-D2)
